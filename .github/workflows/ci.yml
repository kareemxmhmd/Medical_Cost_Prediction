name: Medical Cost Prediction CI/CD & Model Governance Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Pytest Suite with Code Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build

  model-governance-and-audit:
    name: Model Governance & Performance Benchmark Audit
    runs-on: ubuntu-latest
    needs: code-quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Model Artifacts & Metric Thresholds
        run: |
          python -c "
          import json
          with open('artifacts/model_info.json') as f:
              info = json.load(f)
          print('Loaded Model Version:', info.get('version'))
          metrics = info.get('metrics', {})
          mae = metrics.get('mae', 99999)
          r2 = metrics.get('r2', 0)
          cov = metrics.get('coverage_80', 0)
          print(f'Governance check: MAE=${mae}, R2={r2}, Coverage={cov:.2%}')
          assert mae <= 1800.0, f'MAE threshold breached: {mae} > 1800'
          assert r2 >= 0.85, f'R2 threshold breached: {r2} < 0.85'
          assert 0.75 <= cov <= 0.90, f'Prediction interval coverage breached: {cov} not in [0.75, 0.90]'
          print('All Model Governance Audits PASSED.')
          "

  docker-build-check:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests, frontend-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t medical-cost-engine-api:latest .

      - name: Build Frontend Docker Image
        run: |
          docker build -t medical-cost-engine-frontend:latest ./frontend
